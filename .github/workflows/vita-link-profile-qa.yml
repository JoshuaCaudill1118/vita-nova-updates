name: Vita Link Profile Dashboard macOS QA

on:
  push:
    branches: [agent/vita-link-profile-intel-qa]

permissions:
  contents: read

jobs:
  profiles-and-tables:
    runs-on: macos-15-intel
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        theme: [LIGHT]
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: qa
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify Profile Details with a synthetic database
        run: |
          set -euo pipefail
          brew install postgresql@18
          curl -fLsS --retry 3 -o VitaNovaDatabase.jar "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/windows/VitaNovaDatabase-1.1.38.jar"
          shasum -a 256 -c qa/candidate.sha256
          pgbin="$(brew --prefix postgresql@18)/bin"
          fixture="$RUNNER_TEMP/vita-fixture"
          "$pgbin/initdb" -D "$fixture" -U merge_test -A trust --no-locale
          "$pgbin/pg_ctl" -D "$fixture" -l "$RUNNER_TEMP/pg-fixture.log" -o '-p 55472 -h 127.0.0.1' -w start
          trap '"$pgbin/pg_ctl" -D "$fixture" -m fast -w stop' EXIT
          "$JAVA_HOME/bin/javac" --release 21 -cp VitaNovaDatabase.jar -d qa-classes qa/BootstrapFixture.java qa/ProfileDashboardProbe.java qa/DarkTableAudit.java
          "$JAVA_HOME/bin/java" -cp "VitaNovaDatabase.jar:qa-classes" BootstrapFixture
          for settings in ${{ matrix.theme }},false,false ${{ matrix.theme }},true,true; do
            "$JAVA_HOME/bin/java" -Dvitalink.appearance.preview=true "-Dvitalink.appearance.preview.settings=$settings" \
              -cp "VitaNovaDatabase.jar:qa-classes" main.java.util.ProfileDashboardProbe "mac-profile-review/$settings" 1024
          done
          for settings in ${{ matrix.theme }},false,false ${{ matrix.theme }},true,false ${{ matrix.theme }},false,true ${{ matrix.theme }},true,true; do
            "$JAVA_HOME/bin/java" "-Dvitalink.appearance.preview.settings=$settings" \
              -cp "VitaNovaDatabase.jar:qa-classes" main.java.util.DarkTableAudit "mac-profile-review/table-audit-$settings.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-profile-dashboard-${{ matrix.theme }}
          path: mac-profile-review

name: Vita Link macOS QA

on:
  push:
    branches: [agent/vita-link-appearance-mac-intel-qa]

permissions:
  contents: read

jobs:
  desktop:
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: qa
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify packaged staff build on macOS
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" --version
          curl -fLsS --retry 3 -o VitaNovaDatabase.jar "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/windows/VitaNovaDatabase-1.1.37.jar"
          shasum -a 256 -c qa/candidate.sha256
          "$JAVA_HOME/bin/javac" --release 21 -cp VitaNovaDatabase.jar -d qa-classes qa/MacStaffProbe.java qa/StaffAppearancePreview.java
          while read -r name settings computer expected; do
            if [[ "$computer" == true ]]; then
              defaults write -g AppleInterfaceStyle -string Dark
            else
              defaults delete -g AppleInterfaceStyle 2>/dev/null || true
            fi
            native=false
            case "$name" in follow-light|light-both|dark-both) native=true ;; esac
            "$JAVA_HOME/bin/java" -cp "VitaNovaDatabase.jar:qa-classes" main.java.util.MacStaffProbe "$settings" "$expected" "$native"
            "$JAVA_HOME/bin/java" "-Dvitalink.appearance.preview.settings=$settings" -cp "VitaNovaDatabase.jar:qa-classes" main.java.util.StaffAppearancePreview --verify "mac-review/$name"
          done < qa/appearance-cases.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-staff-appearance
          path: mac-review
  dashboards:
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: qa
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare synthetic dashboard database
        run: brew install postgresql@18
      - name: Verify all packaged dashboards on macOS
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o VitaNovaDatabase.jar "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/windows/VitaNovaDatabase-1.1.37.jar"
          shasum -a 256 -c qa/candidate.sha256
          pgbin="$(brew --prefix postgresql@18)/bin"
          fixture="$RUNNER_TEMP/vita-fixture"
          "$pgbin/initdb" -D "$fixture" -U merge_test -A trust --no-locale
          "$pgbin/pg_ctl" -D "$fixture" -l "$RUNNER_TEMP/pg-fixture.log" -o '-p 55472 -h 127.0.0.1' -w start
          trap '"$pgbin/pg_ctl" -D "$fixture" -m fast -w stop' EXIT
          "$JAVA_HOME/bin/javac" --release 21 -cp VitaNovaDatabase.jar -d qa-classes qa/BootstrapFixture.java qa/StaffAppearancePreview.java qa/StaffDashboardAppearanceAudit.java
          "$JAVA_HOME/bin/java" -cp "VitaNovaDatabase.jar:qa-classes" BootstrapFixture
          failures=0
          while read -r name settings computer expected; do
            if [[ "$computer" == true ]]; then
              defaults write -g AppleInterfaceStyle -string Dark
            else
              defaults delete -g AppleInterfaceStyle 2>/dev/null || true
            fi
            "$JAVA_HOME/bin/java" "-Dvitalink.appearance.preview.settings=$settings" -cp "VitaNovaDatabase.jar:qa-classes" main.java.util.StaffDashboardAppearanceAudit "mac-dashboard-review/$name" || failures=$((failures + 1))
          done < qa/appearance-cases.txt
          test "$failures" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-staff-dashboards
          path: mac-dashboard-review

name: Vita Link macOS QA

on:
  push:
    branches: [agent/vita-link-appearance-mac-qa]

permissions:
  contents: read

jobs:
  desktop:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: qa
      - name: Verify packaged staff build on macOS
        run: |
          set -euo pipefail
          export JAVA_HOME="$(/usr/libexec/java_home -v 25)"
          "$JAVA_HOME/bin/java" --version
          curl -fLsS --retry 3 -o VitaNovaDatabase.jar "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/windows/VitaNovaDatabase-1.1.36.jar"
          shasum -a 256 -c qa/candidate.sha256
          "$JAVA_HOME/bin/javac" --release 21 -cp VitaNovaDatabase.jar -d qa-classes qa/MacStaffProbe.java qa/StaffAppearancePreview.java
          while read -r name mode computer expected; do
            if [[ "$computer" == dark ]]; then
              defaults write -g AppleInterfaceStyle -string Dark
            else
              defaults delete -g AppleInterfaceStyle 2>/dev/null || true
            fi
            "$JAVA_HOME/bin/java" -cp "VitaNovaDatabase.jar:qa-classes" main.java.util.MacStaffProbe "$mode" "$expected"
            "$JAVA_HOME/bin/java" "-Dvitalink.appearance.preview.mode=$mode" -cp "VitaNovaDatabase.jar:qa-classes" main.java.util.StaffAppearancePreview --verify "mac-review/$name"
          done <<'MODES'
          follow-light SYSTEM light false
          follow-dark SYSTEM dark true
          dark DARK light true
          colorblind-light COLORBLIND light false
          colorblind-dark COLORBLIND dark true
          low-vision-light LOW_VISION light false
          low-vision-dark LOW_VISION dark true
          MODES
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-staff-appearance
          path: mac-review
  dashboards:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: qa
      - name: Prepare synthetic dashboard database
        run: brew install postgresql@18
      - name: Verify all packaged dashboards on macOS
        run: |
          set -euo pipefail
          export JAVA_HOME="$(/usr/libexec/java_home -v 25)"
          curl -fLsS --retry 3 -o VitaNovaDatabase.jar "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/windows/VitaNovaDatabase-1.1.36.jar"
          shasum -a 256 -c qa/candidate.sha256
          pgbin="$(brew --prefix postgresql@18)/bin"
          fixture="$RUNNER_TEMP/vita-fixture"
          "$pgbin/initdb" -D "$fixture" -U merge_test -A trust --no-locale
          "$pgbin/pg_ctl" -D "$fixture" -l "$RUNNER_TEMP/pg-fixture.log" -o '-p 55472 -h 127.0.0.1' -w start
          trap '"$pgbin/pg_ctl" -D "$fixture" -m fast -w stop' EXIT
          "$JAVA_HOME/bin/javac" --release 21 -cp VitaNovaDatabase.jar -d qa-classes qa/BootstrapFixture.java qa/StaffAppearancePreview.java qa/StaffDashboardAppearanceAudit.java
          "$JAVA_HOME/bin/java" -cp "VitaNovaDatabase.jar:qa-classes" BootstrapFixture
          failures=0
          while read -r name mode computer; do
            if [[ "$computer" == dark ]]; then
              defaults write -g AppleInterfaceStyle -string Dark
            else
              defaults delete -g AppleInterfaceStyle 2>/dev/null || true
            fi
            "$JAVA_HOME/bin/java" "-Dvitalink.appearance.preview.mode=$mode" -cp "VitaNovaDatabase.jar:qa-classes" main.java.util.StaffDashboardAppearanceAudit "mac-dashboard-review/$name" || failures=$((failures + 1))
          done <<'MODES'
          follow-light SYSTEM light
          follow-dark SYSTEM dark
          dark DARK light
          colorblind-light COLORBLIND light
          colorblind-dark COLORBLIND dark
          low-vision-light LOW_VISION light
          low-vision-dark LOW_VISION dark
          MODES
          test "$failures" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-staff-dashboards
          path: mac-dashboard-review

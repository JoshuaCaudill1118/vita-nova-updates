name: Vita Link client screens and Reports on macOS

on:
  push:
    branches: [agent/vita-link-client-report-mac-qa]

permissions:
  contents: read

jobs:
  display:
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: qa
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify desktop screens with synthetic records
        run: |
          set -euo pipefail
          brew install postgresql@18
          curl -fLsS --retry 3 -o VitaNovaDatabase.jar "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/windows/VitaNovaDatabase-1.1.39.jar"
          shasum -a 256 -c qa/candidate.sha256
          pgbin="$(brew --prefix postgresql@18)/bin"
          fixture="$RUNNER_TEMP/vita-display"
          "$pgbin/initdb" -D "$fixture" -U merge_test -A trust --no-locale
          "$pgbin/pg_ctl" -D "$fixture" -l "$RUNNER_TEMP/pg-fixture.log" -o '-p 55472 -h 127.0.0.1' -w start
          trap '"$pgbin/pg_ctl" -D "$fixture" -m fast -w stop' EXIT
          "$JAVA_HOME/bin/javac" --release 21 -cp VitaNovaDatabase.jar -d qa-classes qa/BootstrapFixture.java qa/DisplayProbe.java qa/DarkTableAudit.java
          "$JAVA_HOME/bin/java" -cp "VitaNovaDatabase.jar:qa-classes" BootstrapFixture
          failures=0
          for setting in DARK,false,false DARK,true,true LIGHT,false,false LIGHT,true,true; do
            "$JAVA_HOME/bin/java" "-Dvitalink.appearance.preview.settings=$setting" -cp "VitaNovaDatabase.jar:qa-classes" \
              main.java.util.DisplayProbe "mac-review/$setting" 1024 || failures=$((failures + 1))
          done
          "$JAVA_HOME/bin/java" "-Dvitalink.appearance.preview.settings=DARK,true,true" -cp "VitaNovaDatabase.jar:qa-classes" \
            main.java.util.DarkTableAudit "mac-review/populated-tables.txt" || failures=$((failures + 1))
          test "$failures" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-reports-mac-review
          path: mac-review
